<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圆定理侦探社 | 像素风几何解谜 · 中英文语音版 | 劣弧角度修复</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        :root {
            --game-bg: #e8eef2;
            --container-bg: #fef9e8;
            --canvas-stage-bg: #fef7e0;
            --panel-bg: #fff6e8;
            --brief-bg: #fffcf0;
            --clue-bg: #fffdf5;
            --status-bg: #fff4e4;
            --text-dark: #5c4b2c;
            --text-muted: #7a6848;
            --border-light: #cbd5e0;
            --shadow-dark: #d0d8e4;
            --button-bg: #f0e4d0;
            --button-shadow: #cbbf9f;
        }

        body.dark-mode {
            --game-bg: #1e2a32;
            --container-bg: #2c3e2f;
            --canvas-stage-bg: #2f3e2c;
            --panel-bg: #2c3a28;
            --brief-bg: #3e4e36;
            --clue-bg: #3e4e36;
            --status-bg: #3e4e36;
            --text-dark: #eeddaa;
            --text-muted: #cbba8a;
            --border-light: #6a7c5e;
            --shadow-dark: #4a5a4a;
            --button-bg: #5a6e4a;
            --button-shadow: #3a4a3a;
        }

        body {
            background: var(--game-bg);
            transition: background 0.3s, color 0.3s;
            margin: 0;
            font-family: 'Courier New', monospace;
        }

        .game-full-container {
            background: var(--game-bg);
            padding: 20px 20px 30px;
            width: 100%;
        }
        
        .detective-container {
            background: var(--container-bg);
            box-shadow: 0 0 0 4px var(--border-light), 0 0 0 8px var(--shadow-dark), 0 8px 24px rgba(0,0,0,0.1);
            padding: 1.2rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            border-radius: 0;
        }
        
        .game-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
        }
        
        .canvas-stage {
            flex: 3;
            min-width: 500px;
            background: var(--canvas-stage-bg);
            border: 3px solid var(--border-light);
            box-shadow: inset 0 0 0 2px #f5f0e0, 4px 4px 0px 0px var(--shadow-dark);
            padding: 0.5rem;
            position: relative;
            cursor: crosshair;
        }
        
        canvas {
            display: block;
            width: 100%;
            background: #fff9ef;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            cursor: crosshair;
            box-shadow: inset 0 0 0 1px #e2dcc0;
        }
        
        body.dark-mode canvas {
            background: #2c3824;
        }
        
        .case-panel {
            flex: 1.2;
            min-width: 280px;
            background: var(--panel-bg);
            border: 3px solid var(--border-light);
            padding: 1rem;
            box-shadow: inset 2px 2px 0px #fffef8, 4px 4px 0px var(--shadow-dark);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        
        .lang-voice-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            background: var(--brief-bg);
            border: 1px solid #e2cfaa;
            padding: 6px 10px;
            border-radius: 40px;
        }
        .lang-btn {
            background: #e9ddc7;
            border: none;
            font-family: monospace;
            font-size: 0.6rem;
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            color: #5e4a2c;
            transition: 0.1s;
        }
        body.dark-mode .lang-btn {
            background: #4a5e3a;
            color: #eeddaa;
        }
        .lang-btn.active {
            background: #dba643;
            color: white;
            box-shadow: inset 0 1px 2px #fff3cf, 0 2px 3px rgba(0,0,0,0.1);
        }
        body.dark-mode .lang-btn.active {
            background: #dba643;
            color: #2c3e2f;
        }
        .speak-icon-btn, .dark-toggle-btn {
            background: #f0e4d0;
            border: none;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        body.dark-mode .speak-icon-btn, body.dark-mode .dark-toggle-btn {
            background: #5a6e4a;
            color: #fef0cf;
        }
        
        .brief {
            background: var(--brief-bg);
            border-left: 6px solid #e9b35f;
            padding: 0.8rem;
        }
        .brief h2 { margin: 0 0 0.5rem; font-size: 0.85rem; color: var(--text-dark); }
        .brief p { margin: 0; font-size: 0.65rem; color: var(--text-muted); }
        
        .status-area {
            background: var(--status-bg);
            border: 2px solid var(--border-light);
            padding: 0.6rem;
            font-size: 0.6rem;
            color: var(--text-dark);
            font-family: 'Courier New', monospace;
        }
        
        .clue-box {
            background: var(--clue-bg);
            border: 2px dashed #dac29c;
            padding: 0.7rem;
            min-height: 150px;
        }
        .clue-label {
            font-weight: bold;
            color: #b87c2e;
            font-size: 0.55rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clue-content {
            font-size: 0.65rem;
            color: var(--text-dark);
            font-family: 'Courier New', monospace;
            word-break: break-word;
        }
        .mistake-tip {
            font-size:0.5rem; 
            margin-top:6px; 
            color:#b37b2e;
        }
        .angle-readout {
            background: #f5edda;
            padding: 6px 8px;
            font-size: 0.55rem;
            font-family: monospace;
            color: #a76f2c;
            margin-top: 8px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        body.dark-mode .angle-readout {
            background: #4a5e3a;
            color: #eeddaa;
        }
        .input-group {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-group input {
            background: #fffcf0;
            border: 1px solid #dccfae;
            color: #6b4e24;
            font-family: monospace;
            font-size: 0.6rem;
            padding: 6px 8px;
            width: 70px;
            text-align: center;
        }
        body.dark-mode .input-group input {
            background: #2c3e2f;
            color: #eeddaa;
            border-color: #6a7c5e;
        }
        .success-badge {
            background: #e9cf9b;
            color: #5c421f;
            padding: 4px 8px;
            font-size: 0.5rem;
            text-align: center;
            margin-top: 8px;
            display: none;
        }
        .action-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        button {
            background: var(--button-bg);
            border: none;
            padding: 0.6rem 0.8rem;
            font-family: 'Courier New', monospace;
            font-size: 0.55rem;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 0 3px 0 var(--button-shadow);
            transition: 0.05s linear;
            text-transform: uppercase;
        }
        button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--button-shadow); }
        button.primary { background: #e5d5b8; }
        button.warning { background: #e6cfaa; }
        body.dark-mode button.primary { background: #6a8a5a; color: #fef0cf; }
        body.dark-mode button.warning { background: #8a6a4a; color: #fef0cf; }
        .badge-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
        .medal { background: #eae2d0; border: 1px solid #ccbc9c; padding: 4px 6px; font-size: 0.5rem; color: #7e6a48; }
        body.dark-mode .medal { background: #4a5e3a; border-color: #6a7c5e; color: #eeddaa; }
        .medal.active { background: #e9cf9b; color: #4a371a; border-color: #dba643; }
        body.dark-mode .medal.active { background: #dba643; color: #2c3e2f; }
        .case-counter { font-size: 0.5rem; color: #b8883a; text-align: center; margin-top: 4px; }
        @keyframes pixelBlink { 0% { filter: drop-shadow(0 0 0px #ffdd99);} 50% { filter: drop-shadow(0 0 6px #ffbb66);} }
        @keyframes shakeAnim { 0% { transform: translate(1px, 1px);} 25% { transform: translate(-1px, 0px);} }
        .correct-flash { animation: pixelBlink 0.3s 2; }
        .wrong-shake { animation: shakeAnim 0.15s 2; }
        @media (max-width: 768px) { .canvas-stage { min-width: 280px; } }
    </style>
</head>
<body>
<div class="game-full-container">
    <div class="detective-container">
        <div class="game-layout">
            <div class="canvas-stage">
                <canvas id="geometryCanvas" width="720" height="540" style="width:100%; height:auto;"></canvas>
                <div class="small-note" id="canvasNote" style="font-size:0.45rem; text-align:center; margin-top:5px;">🖱️ 拖拽彩色圆点 | 观察角度 | 完成定理推理</div>
            </div>
            <div class="case-panel">
                <div class="lang-voice-bar">
                    <div style="display:flex; gap:6px;">
                        <button id="langZhBtn" class="lang-btn active">🇨🇳 中文</button>
                        <button id="langEnBtn" class="lang-btn">🇬🇧 English</button>
                    </div>
                    <button id="darkModeToggle" class="dark-toggle-btn dark-mode-toggle">🌙 暗黑</button>
                    <button id="speakCaseBtn" class="speak-icon-btn">🔊 朗读案件</button>
                    <button id="speakClueBtn" class="speak-icon-btn">📜 朗读线索</button>
                </div>

                <div class="brief" id="caseBrief">
                    <h2>CASE #01: 剧院舞台灯错位</h2>
                    <p>拖拽A/B/C/D点，使圆心角AOB = 圆心角COD</p>
                </div>
                <div class="status-area" id="statusMsg">
                    📋 侦探手册<br>拖拽圆上的彩色点，观察角度变化
                </div>
                <div class="clue-box">
                    <div class="clue-label">
                        <span id="clueLabelText">📜 定理线索手册</span>
                        <button id="speakMeasurementBtn" style="background: none; font-size:0.55rem; padding:2px 6px; box-shadow: none;">🔊 读数据</button>
                    </div>
                    <div class="clue-content" id="clueText">当前案件对应的圆定理将在这里展示</div>
                    <div id="mistakeTip" class="mistake-tip"></div>
                    <div id="liveReadout" class="angle-readout">
                        <span>📐 测量数据: --</span>
                    </div>
                    <div id="interactiveInput" class="input-group"></div>
                    <div id="successMsg" class="success-badge">✨ 定理理解成功 ✨</div>
                </div>
                <div class="action-buttons">
                    <button id="resetBtn" class="warning">🔄 重置案件</button>
                    <button id="nextCaseBtn" class="primary">🔍 下一案件 →</button>
                    <button id="prevCaseBtn" class="primary">← 上一案件</button>
                    <button id="proveBtn" class="primary">🏆 结案陈词</button>
                    <button id="backToHome" class="primary" style="background:#d4a85c;">🏠 返回主页</button>
                </div>
                <div class="badge-row" id="badgeContainer"></div>
                <div class="case-counter" id="caseCounter">案件 1 / 5 · 圆心角定理</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ==================== 音效管理 ====================
        const sounds = {
            drag: new Audio('assets/sounds/drag.mp3'),
            error: new Audio('assets/sounds/error.mp3'),
            pageFlip: new Audio('assets/sounds/page-flip.mp3'),
            success: new Audio('assets/sounds/success.mp3')
        };
        for (let key in sounds) {
            sounds[key].load();
        }
        function playSound(name, volume = 0.5) {
            const s = sounds[name];
            if (s) {
                s.volume = volume;
                s.currentTime = 0;
                s.play().catch(e => console.log('音效播放失败:', e));
            }
        }

        // ==================== 多语言文本 ====================
        const LANG_TEXTS = {
            zh: {
                canvasNote: "🖱️ 拖拽彩色圆点 | 观察角度 | 完成定理推理",
                clueLabel: "📜 定理线索手册",
                measurementBtn: "🔊 读数据",
                speakCaseBtn: "🔊 朗读案件",
                speakClueBtn: "📜 朗读线索",
                resetBtn: "🔄 重置案件",
                nextBtn: "🔍 下一案件 →",
                prevBtn: "← 上一案件",
                proveBtn: "🏆 结案陈词",
                caseTitles: [
                    "CASE #01: 剧院舞台灯错位",
                    "CASE #02: 瞭望塔探照灯",
                    "CASE #03: 古桥石拱裂缝",
                    "CASE #04: 航海罗盘刻度",
                    "CASE #05: 漏水检测仪"
                ],
                caseDescs: [
                    "🎭 拖拽A/B/C/D点，使圆心角AOB = 圆心角COD",
                    "🏰 拖拽锡兵P，观察∠APB和∠AOB的关系，填写正确答案",
                    "🌉 拖拽弦端点C/D，使桥柱(直径)垂直于弦CD（使弦CD水平）",
                    "🧭 观察四边形顶点，记录对角和并验证互补关系",
                    "💧 拖拽P和P'沿虚线滑动，使两点在交点重合，PA = P'B"
                ],
                theoremNames: ["圆心角定理","圆周角定理","垂径定理","圆内接四边形定理","切线长定理"],
                theorems: [
                    "[圆心角定理] 相等的圆心角所对的弧相等，所对的弦相等",
                    "[圆周角定理] 同弧所对圆周角是圆心角的一半",
                    "[垂径定理] 垂直于弦的直径平分这条弦",
                    "[圆内接四边形定理] 对角互补(和为180°)",
                    "[切线长定理] 从圆外一点引圆的两条切线，切线长相等"
                ],
                statusDefault: "📋 侦探手册\n拖拽圆上的彩色点，观察角度变化",
                conditionMetMsg: "✨ 线索解锁 ✨",
                conditionNotMet: "❌ 条件未满足",
                correctInputHint: "✓ 正确！",
                wrongInputHint: "✗ 错误，再试试看",
                proveSuccess: "🏆 像素侦探徽章GET！案件完美落幕！",
                proveAlready: "🎉 已破获此案，继续挑战新案件吧！",
                proveFail: "⚠️ 尚未满足定理条件，请先构造正确图形再结案。",
                measurementReadoutPrefix: "当前测量数据：",
                hintTexts: {0:"使两个扇形角度相等",2:"使弦CD水平（垂直于垂直直径）",4:"将P和P'拖到交点",default:"调整图形"},
                inputPlaceholder: "例如 1/3", inputSumPlaceholder: "度数", inputVerify: "验证",
                inputHintGeneric: "✨ 拖拽点满足条件后点击结案 ✨",
                relationQuestion: "∠APB = (  ) ∠AOB", sumQuestion: "∠A+∠C = ∠B+∠D = (  ) °",
                badgeShort: ["圆心角","圆周角","垂径","内接四边","切线长"]
            },
            en: {
                canvasNote: "🖱️ Drag points | Observe angles | Prove theorems",
                clueLabel: "📜 Theorem Clue Book", measurementBtn: "🔊 Read Data",
                speakCaseBtn: "🔊 Read Case", speakClueBtn: "📜 Read Clue",
                resetBtn: "🔄 Reset Case", nextBtn: "🔍 Next Case →", prevBtn: "← Previous Case", proveBtn: "🏆 Close Case",
                caseTitles: ["Stage Lights","Lookout Spotlight","Stone Arch","Compass Scale","Leak Detector"],
                caseDescs: [
                    "Drag A/B/C/D so central angles AOB = COD",
                    "Drag P, find relation ∠APB : ∠AOB",
                    "Drag C/D so diameter ⟂ chord CD (make CD horizontal)",
                    "Check cyclic quadrilateral angles",
                    "Drag P/P' to intersection, PA=P'B"
                ],
                theoremNames: ["Central Angle","Inscribed Angle","Perpendicular Chord","Cyclic Quadrilateral","Tangent Length"],
                theorems: [
                    "Equal central angles ⇒ equal arcs & chords",
                    "Inscribed angle = ½ central angle",
                    "Diameter ⟂ chord ⇒ bisects chord",
                    "Opposite angles sum to 180°",
                    "Tangents from one point are equal"
                ],
                statusDefault: "📋 Drag points, observe angles",
                conditionMetMsg: "✨ Clue Unlocked", conditionNotMet: "❌ Not met",
                correctInputHint: "✓ Correct", wrongInputHint: "✗ Try again",
                proveSuccess: "🏆 Case closed!", proveAlready: "🎉 Already solved", proveFail: "⚠️ Adjust figure first",
                measurementReadoutPrefix: "Current: ",
                hintTexts: {0:"Make angles equal",2:"Make CD horizontal",4:"Drag to intersection",default:"Adjust figure"},
                inputPlaceholder: "1/2", inputSumPlaceholder: "deg", inputVerify: "OK",
                inputHintGeneric: "Match condition then close case",
                relationQuestion: "∠APB = (  ) × ∠AOB", sumQuestion: "Sum = (  ) °",
                badgeShort: ["Central","Inscribed","Chord","Cyclic","Tangent"]
            }
        };

        let currentLang = "zh";
        let speechSynth = window.speechSynthesis;
        
        // 几何函数
        function getMinorArcAngleRad(a,b){let d=Math.abs(a-b);return Math.min(d,2*Math.PI-d);}
        function getMinorArcAngleDegrees(a,b){return Math.round(getMinorArcAngleRad(a,b)*180/Math.PI);}
        function computeAngle(ax,ay,bx,by,cx,cy){
            let bax=ax-bx,bay=ay-by,bcx=cx-bx,bcy=cy-by;
            let dot=bax*bcx+bay*bcy,mag=Math.hypot(bax,bay)*Math.hypot(bcx,bcy);
            return mag===0?0:Math.acos(Math.min(1,Math.max(-1,dot/mag)));
        }
        function drawSector(cx,cy,r,s,e,c){
            let st=s,ed=e,d=ed-st;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
            if(d<0){let t=st;st=ed;ed=t;d=-d;}
            ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,st,ed);ctx.closePath();
            ctx.fillStyle=c;ctx.fill();
        }
        function drawPoint(x,y,col,lbl){
            ctx.fillStyle=col;ctx.fillRect(x-6,y-6,12,12);
            if(lbl){ctx.fillStyle="#333";ctx.font="bold 11px monospace";ctx.fillText(lbl,x-8,y-10);}
        }
        function getTangentLine(a,cx,cy,r){
            let px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);
            return {px,py,dirX:-Math.sin(a),dirY:Math.cos(a)};
        }
        function getLineIntersection(l1,l2){
            let x1=l1.px,y1=l1.py,x2=l2.px,y2=l2.py;
            let dx1=l1.dirX,dy1=l1.dirY,dx2=l2.dirX,dy2=l2.dirY;
            let det=dx1*dy2-dy1*dx2;if(Math.abs(det)<0.001)return null;
            let t=((x2-x1)*dy2-(y2-y1)*dx2)/det;
            return {x:x1+t*dx1,y:y1+t*dy1};
        }
        function getPointOnTangent(t,l){return {x:l.px+t*l.dirX,y:l.py+t*l.dirY};}

        let canvas=document.getElementById('geometryCanvas'),ctx=canvas.getContext('2d');
        let w=720,h=540;canvas.width=w;canvas.height=h;
        let geom={
            cx:w/2,cy:h/2-8,r:170,
            angA:0.7,angB:2.0,angC:2.5,angD:3.8,
            fixedA:0.8,fixedB:2.5,soldierP:3.2,
            chord1:1.0,chord2:2.2,
            quadAngles:[0.5,1.8,2.7,4.0],
            paramP:10,paramQ:-15
        };
        let getTangentA=()=>getTangentLine(geom.fixedA,geom.cx,geom.cy,geom.r);
        let getTangentB=()=>getTangentLine(geom.fixedB,geom.cx,geom.cy,geom.r);
        let getIntersect=()=>getLineIntersection(getTangentA(),getTangentB());
        let getP=()=>getPointOnTangent(geom.paramP,getTangentA());
        let getQ=()=>getPointOnTangent(geom.paramQ,getTangentB());

        let currentCaseIdx=0,solved=[!1,!1,!1,!1,!1],condMet=!1,drag=null,dragQ=-1;
        let lastConditionOk = false;

        const CASES = [
            {id:0,name:"圆心角",check:s=>Math.abs(getMinorArcAngleRad(s.angA,s.angB)-getMinorArcAngleRad(s.angC,s.angD))<0.08,
            getReadout:s=>`AOB=${getMinorArcAngleDegrees(s.angA,s.angB)}° COD=${getMinorArcAngleDegrees(s.angC,s.angD)}°`,
            draw:()=>{
                drawSector(geom.cx,geom.cy,geom.r,geom.angA,geom.angB,"rgba(210,140,90,.5)");
                drawSector(geom.cx,geom.cy,geom.r,geom.angC,geom.angD,"rgba(100,150,200,.5)");
                drawPoint(geom.cx+geom.r*Math.cos(geom.angA),geom.cy+geom.r*Math.sin(geom.angA),"#c97e3a","A");
                drawPoint(geom.cx+geom.r*Math.cos(geom.angB),geom.cy+geom.r*Math.sin(geom.angB),"#c97e3a","B");
                drawPoint(geom.cx+geom.r*Math.cos(geom.angC),geom.cy+geom.r*Math.sin(geom.angC),"#5f8ab3","C");
                drawPoint(geom.cx+geom.r*Math.cos(geom.angD),geom.cy+geom.r*Math.sin(geom.angD),"#5f8ab3","D");
            }},
            {id:1,name:"圆周角",check:()=>!0,
            getReadout:s=>{
                let ca=getMinorArcAngleRad(s.fixedA,s.fixedB);
                let ax=s.cx+s.r*Math.cos(s.fixedA),ay=s.cy+s.r*Math.sin(s.fixedA);
                let bx=s.cx+s.r*Math.cos(s.fixedB),by=s.cy+s.r*Math.sin(s.fixedB);
                let px=s.cx+s.r*Math.cos(s.soldierP),py=s.cy+s.r*Math.sin(s.soldierP);
                let ap=computeAngle(ax,ay,px,py,bx,by);
                return `AOB=${Math.round(ca*180/Math.PI)}° APB=${Math.round(ap*180/Math.PI)}°`;
            },
            draw:()=>{
                let ax=geom.cx+geom.r*Math.cos(geom.fixedA),ay=geom.cy+geom.r*Math.sin(geom.fixedA);
                let bx=geom.cx+geom.r*Math.cos(geom.fixedB),by=geom.cy+geom.r*Math.sin(geom.fixedB);
                let px=geom.cx+geom.r*Math.cos(geom.soldierP),py=geom.cy+geom.r*Math.sin(geom.soldierP);
                drawSector(geom.cx,geom.cy,geom.r,geom.fixedA,geom.fixedB,"rgba(220,180,80,.35)");
                ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(px,py);ctx.lineTo(bx,by);
                ctx.strokeStyle="#c68b3e";ctx.lineWidth=2.5;ctx.stroke();
                drawPoint(ax,ay,"#7a9bcb","A");drawPoint(bx,by,"#d98c3a","B");drawPoint(px,py,"#d9942e","P");
            }},
            {id:2,name:"垂径",check:s=>{
                let x1=s.cx+s.r*Math.cos(s.chord1),y1=s.cy+s.r*Math.sin(s.chord1);
                let x2=s.cx+s.r*Math.cos(s.chord2),y2=s.cy+s.r*Math.sin(s.chord2);
                let dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
                return len>0.1 && Math.abs(dy)/len < 0.12;
            },
            getReadout:s=>{
                let x1=s.cx+s.r*Math.cos(s.chord1),y1=s.cy+s.r*Math.sin(s.chord1);
                let x2=s.cx+s.r*Math.cos(s.chord2),y2=s.cy+s.r*Math.sin(s.chord2);
                let dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);
                let isPerp = len>0.1 && Math.abs(dy)/len < 0.12;
                return `垂直: ${isPerp ? "✓ 是" : "✗ 否"}`;
            },
            draw:()=>{
                let x1=geom.cx+geom.r*Math.cos(geom.chord1),y1=geom.cy+geom.r*Math.sin(geom.chord1);
                let x2=geom.cx+geom.r*Math.cos(geom.chord2),y2=geom.cy+geom.r*Math.sin(geom.chord2);
                ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle="#b87c48";ctx.lineWidth=4;ctx.stroke();
                ctx.beginPath();ctx.moveTo(geom.cx,geom.cy-geom.r);ctx.lineTo(geom.cx,geom.cy+geom.r);ctx.strokeStyle="#7799bb";ctx.lineWidth=3;ctx.stroke();
                drawPoint(x1,y1,"#b87c48","C");drawPoint(x2,y2,"#b87c48","D");
            }},
            {id:3,name:"内接四边形",check:()=>!0,
            getReadout:s=>{
                let p=s.quadAngles.map(a=>({x:s.cx+s.r*Math.cos(a),y:s.cy+s.r*Math.sin(a)}));
                let ag=[];for(let i=0;i<4;i++){
                    let pr=p[(i+3)%4],cu=p[i],ne=p[(i+1)%4];
                    ag.push(Math.round(computeAngle(pr.x,pr.y,cu.x,cu.y,ne.x,ne.y)*180/Math.PI));
                }
                return `A${ag[0]} B${ag[1]} C${ag[2]} D${ag[3]} | A+C=${ag[0]+ag[2]}`;
            },
            draw:()=>{
                let p=geom.quadAngles.map(a=>({x:geom.cx+geom.r*Math.cos(a),y:geom.cy+geom.r*Math.sin(a)}));
                ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<4;i++)ctx.lineTo(p[i].x,p[i].y);ctx.closePath();
                ctx.strokeStyle="#c9aa6e";ctx.lineWidth=2.5;ctx.stroke();
                for(let i=0;i<4;i++)drawPoint(p[i].x,p[i].y,"#ddae6e",String.fromCharCode(65+i));
            }},
            {id:4,name:"切线长",check:s=>{
                let p=getP(),q=getQ(),ix=getIntersect();if(!ix)return!1;
                let dP=Math.hypot(p.x-ix.x,p.y-ix.y),dQ=Math.hypot(q.x-ix.x,q.y-ix.y);
                return dP<12&&dQ<12;
            },
            getReadout:s=>{
                let p=getP(),q=getQ(),ix=getIntersect();
                let a={x:s.cx+s.r*Math.cos(s.fixedA),y:s.cy+s.r*Math.sin(s.fixedA)};
                let b={x:s.cx+s.r*Math.cos(s.fixedB),y:s.cy+s.r*Math.sin(s.fixedB)};
                let la=Math.hypot(p.x-a.x,p.y-a.y),lb=Math.hypot(q.x-b.x,q.y-b.y);
                return `PA=${Math.round(la)} P'B=${Math.round(lb)}`;
            },
            draw:()=>{
                let a=getTangentA(),b=getTangentB(),ix=getIntersect(),p=getP(),q=getQ();
                ctx.setLineDash([8,8]);
                let f=500,s1=getPointOnTangent(-f,a),e1=getPointOnTangent(f,a);
                ctx.beginPath();ctx.moveTo(s1.x,s1.y);ctx.lineTo(e1.x,e1.y);ctx.strokeStyle="#b89a6e";ctx.stroke();
                let s2=getPointOnTangent(-f,b),e2=getPointOnTangent(f,b);
                ctx.beginPath();ctx.moveTo(s2.x,s2.y);ctx.lineTo(e2.x,e2.y);ctx.stroke();
                ctx.setLineDash([]);
                let ax=geom.cx+geom.r*Math.cos(geom.fixedA),ay=geom.cy+geom.r*Math.sin(geom.fixedA);
                let bx=geom.cx+geom.r*Math.cos(geom.fixedB),by=geom.cy+geom.r*Math.sin(geom.fixedB);
                drawPoint(ax,ay,"#7f9fc0","A");drawPoint(bx,by,"#7f9fc0","B");
                if(ix){ctx.fillStyle="#e9cf9b";ctx.beginPath();ctx.arc(ix.x,ix.y,8,0,Math.PI*2);ctx.fill();}
                ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(ax,ay);ctx.strokeStyle="#d98f44";ctx.lineWidth=2.5;ctx.stroke();
                ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(bx,by);ctx.strokeStyle="#6f9e6f";ctx.stroke();
                drawPoint(p.x,p.y,"#d98f44","P");drawPoint(q.x,q.y,"#6f9e6f","P'");
            }}
        ];

        function refreshUI(){
            let t=LANG_TEXTS[currentLang];
            document.getElementById('canvasNote').innerText=t.canvasNote;
            document.getElementById('clueLabelText').innerText=t.clueLabel;
            document.getElementById('speakMeasurementBtn').innerText=t.measurementBtn;
            document.getElementById('speakCaseBtn').innerText=t.speakCaseBtn;
            document.getElementById('speakClueBtn').innerText=t.speakClueBtn;
            document.getElementById('resetBtn').innerText=t.resetBtn;
            document.getElementById('nextCaseBtn').innerText=t.nextBtn;
            document.getElementById('prevCaseBtn').innerText=t.prevBtn;
            document.getElementById('proveBtn').innerText=t.proveBtn;
            updateCase();
        }
        function updateCase(){
            let t=LANG_TEXTS[currentLang];
            document.getElementById('caseBrief').innerHTML=`<h2>${t.caseTitles[currentCaseIdx]}</h2><p>${t.caseDescs[currentCaseIdx]}</p>`;
            document.getElementById('caseCounter').innerText=`Case ${currentCaseIdx+1}/5 · ${t.theoremNames[currentCaseIdx]}`;
            updateStatus();
            renderInput();
            draw();
        }
        function updateStatus(){
            let t=LANG_TEXTS[currentLang];
            let c=CASES[currentCaseIdx];
            let ok = (currentCaseIdx===1 || currentCaseIdx===3) ? condMet : c.check(geom);
            document.getElementById('liveReadout').innerHTML=`📐 ${c.getReadout(geom)}`;
            let txt,st;
            if(ok && !solved[currentCaseIdx]){
                txt=`<span style="color:#b87c2e">${t.conditionMetMsg}</span><br>${t.theorems[currentCaseIdx]}`;
                st=t.conditionMetMsg; document.getElementById('mistakeTip').innerText="✓ 条件满足";
                if(!lastConditionOk) playSound('success', 0.5);
            }else if(ok && solved[currentCaseIdx]){
                txt=`${t.theorems[currentCaseIdx]}<br><span style="color:#888">${t.proveAlready}</span>`;
                st=t.proveAlready; document.getElementById('mistakeTip').innerText="✅ 已完成";
            }else{
                txt=`${t.theorems[currentCaseIdx]}<br><span style="color:#c00">${t.conditionNotMet}</span>`;
                st=t.statusDefault; document.getElementById('mistakeTip').innerText="❌ 未满足条件";
                if(lastConditionOk && !ok) playSound('error', 0.4);
            }
            document.getElementById('clueText').innerHTML=txt;
            document.getElementById('statusMsg').innerText=st;
            lastConditionOk = ok;
            draw();
        }
        function renderInput(){
            let el=document.getElementById('interactiveInput'),t=LANG_TEXTS[currentLang];
            el.innerHTML="";
            if(currentCaseIdx===1){
                el.innerHTML=`<span>${t.relationQuestion}</span><input id="ratioIn" placeholder="${t.inputPlaceholder}"><button onclick="checkRatio()">${t.inputVerify}</button>`;
            }else if(currentCaseIdx===3){
                el.innerHTML=`<span>${t.sumQuestion}</span><input id="sumIn" placeholder="${t.inputSumPlaceholder}"><button onclick="checkSum()">${t.inputVerify}</button>`;
            }else{
                el.innerHTML=`<span style="color:#888">${t.inputHintGeneric}</span>`;
            }
        }
        window.checkRatio=()=>{
            let v=document.getElementById('ratioIn').value.trim().toLowerCase();
            if(v==="1/2"||v==="0.5"||v==="½"){condMet=!0;solved[1]=!0;updateStatus();playSound('success',0.6);}
            else {alert("Wrong! Try 1/2"); playSound('error',0.4);}
        };
        window.checkSum=()=>{
            let v=parseInt(document.getElementById('sumIn').value);
            if(v===180){condMet=!0;solved[3]=!0;updateStatus();playSound('success',0.6);}
            else {alert("Wrong! Sum=180"); playSound('error',0.4);}
        };
        function draw(){
            ctx.clearRect(0,0,w,h);ctx.fillStyle="#fff9ef";ctx.fillRect(0,0,w,h);
            ctx.beginPath();ctx.arc(geom.cx,geom.cy,geom.r,0,Math.PI*2);ctx.strokeStyle="#cbbf9f";ctx.lineWidth=2.2;ctx.stroke();
            CASES[currentCaseIdx].draw();
            ctx.fillStyle="#c68f44";ctx.fillRect(geom.cx-2,geom.cy-2,4,4);ctx.fillStyle="#333";ctx.fillText("O",geom.cx+5,geom.cy+5);
        }
        function mouse(e){
            let r=canvas.getBoundingClientRect(),sx=w/r.width,sy=h/r.height;
            return {x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy};
        }
        canvas.onmousedown=e=>{
            let m=mouse(e),t=20;
            let dragging = false;
            if(currentCaseIdx===0){
                let a={x:geom.cx+geom.r*Math.cos(geom.angA),y:geom.cy+geom.r*Math.sin(geom.angA)};
                let b={x:geom.cx+geom.r*Math.cos(geom.angB),y:geom.cy+geom.r*Math.sin(geom.angB)};
                let c={x:geom.cx+geom.r*Math.cos(geom.angC),y:geom.cy+geom.r*Math.sin(geom.angC)};
                let d={x:geom.cx+geom.r*Math.cos(geom.angD),y:geom.cy+geom.r*Math.sin(geom.angD)};
                if(Math.hypot(m.x-a.x,m.y-a.y)<t){drag="A"; dragging=true;}
                else if(Math.hypot(m.x-b.x,m.y-b.y)<t){drag="B"; dragging=true;}
                else if(Math.hypot(m.x-c.x,m.y-c.y)<t){drag="C"; dragging=true;}
                else if(Math.hypot(m.x-d.x,m.y-d.y)<t){drag="D"; dragging=true;}
            }else if(currentCaseIdx===1){
                let p={x:geom.cx+geom.r*Math.cos(geom.soldierP),y:geom.cy+geom.r*Math.sin(geom.soldierP)};
                if(Math.hypot(m.x-p.x,m.y-p.y)<t){drag="P"; dragging=true;}
            }else if(currentCaseIdx===2){
                let c1={x:geom.cx+geom.r*Math.cos(geom.chord1),y:geom.cy+geom.r*Math.sin(geom.chord1)};
                let c2={x:geom.cx+geom.r*Math.cos(geom.chord2),y:geom.cy+geom.r*Math.sin(geom.chord2)};
                if(Math.hypot(m.x-c1.x,m.y-c1.y)<t){drag="C1"; dragging=true;}
                else if(Math.hypot(m.x-c2.x,m.y-c2.y)<t){drag="C2"; dragging=true;}
            }else if(currentCaseIdx===3){
                let p=geom.quadAngles.map(a=>({x:geom.cx+geom.r*Math.cos(a),y:geom.cy+geom.r*Math.sin(a)}));
                for(let i=0;i<4;i++) if(Math.hypot(m.x-p[i].x,m.y-p[i].y)<t){drag="Q"+i; dragging=true; break;}
            }else if(currentCaseIdx===4){
                let p=getP(),q=getQ();
                if(Math.hypot(m.x-p.x,m.y-p.y)<25){drag="TP"; dragging=true;}
                else if(Math.hypot(m.x-q.x,m.y-q.y)<25){drag="TQ"; dragging=true;}
            }
            if(dragging) playSound('drag', 0.3);
        };
        window.onmousemove=e=>{
            if(!drag)return;let m=mouse(e),a=Math.atan2(m.y-geom.cy,m.x-geom.cx);
            if(currentCaseIdx===0){
                if(drag==="A")geom.angA=a;
                else if(drag==="B")geom.angB=a;
                else if(drag==="C")geom.angC=a;
                else if(drag==="D")geom.angD=a;
            }else if(currentCaseIdx===1&&drag==="P")geom.soldierP=a;
            else if(currentCaseIdx===2){
                if(drag==="C1")geom.chord1=a;
                else if(drag==="C2")geom.chord2=a;
            }else if(currentCaseIdx===3&&drag.startsWith("Q")){
                let i=+drag[1];geom.quadAngles[i]=a;
            }else if(currentCaseIdx===4){
                let ta=getTangentA(),tb=getTangentB();
                if(drag==="TP")geom.paramP=(m.x-ta.px)*ta.dirX+(m.y-ta.py)*ta.dirY;
                else if(drag==="TQ")geom.paramQ=(m.x-tb.px)*tb.dirX+(m.y-tb.py)*tb.dirY;
            }
            updateStatus();
        };
        window.onmouseup=()=>drag=null;
        function reset(){
            if(currentCaseIdx===0){geom.angA=0.7;geom.angB=2;geom.angC=2.5;geom.angD=3.8;}
            else if(currentCaseIdx===1)geom.soldierP=3.2;
            else if(currentCaseIdx===2){geom.chord1=1;geom.chord2=2.2;}
            else if(currentCaseIdx===3)geom.quadAngles=[0.5,1.8,2.7,4];
            else if(currentCaseIdx===4){geom.paramP=10;geom.paramQ=-15;}
            condMet=!1;
            updateStatus();
        }
        function next(){
            playSound('pageFlip', 0.4);
            currentCaseIdx = (currentCaseIdx + 1) % 5;
            reset();
            updateCase();
        }
        function prev(){
            playSound('pageFlip', 0.4);
            currentCaseIdx = (currentCaseIdx - 1 + 5) % 5;
            reset();
            updateCase();
        }
        function prove(){
            let t=LANG_TEXTS[currentLang];
            let ok = (currentCaseIdx===1 || currentCaseIdx===3) ? condMet : CASES[currentCaseIdx].check(geom);
            if(ok && !solved[currentCaseIdx]){
                solved[currentCaseIdx]=!0;
                alert(t.proveSuccess);
                playSound('success', 0.6);
            } else if(ok){
                alert(t.proveAlready);
                playSound('success', 0.5);
            } else {
                alert(t.proveFail);
                playSound('error', 0.5);
            }
            updateStatus();
        }
        function setLang(l){currentLang=l;
            document.getElementById('langZhBtn').classList.toggle('active',l==='zh');
            document.getElementById('langEnBtn').classList.toggle('active',l==='en');
            refreshUI();
        }
        function speak(txt){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang=currentLang==='zh'?'zh-CN':'en-US';speechSynthesis.speak(u);}
        document.getElementById('resetBtn').onclick=reset;
        document.getElementById('nextCaseBtn').onclick=next;
        document.getElementById('prevCaseBtn').onclick=prev;
        document.getElementById('proveBtn').onclick=prove;
        document.getElementById('langZhBtn').onclick=()=>setLang('zh');
        document.getElementById('langEnBtn').onclick=()=>setLang('en');
        document.getElementById('speakCaseBtn').onclick=()=>speak(LANG_TEXTS[currentLang].caseDescs[currentCaseIdx]);
        document.getElementById('speakClueBtn').onclick=()=>speak(LANG_TEXTS[currentLang].theorems[currentCaseIdx]);
        document.getElementById('speakMeasurementBtn').onclick=()=>speak(CASES[currentCaseIdx].getReadout(geom));
        
        document.getElementById('backToHome').onclick = function () {
            window.location.href = "index.html";
        };

        // 暗黑模式
        const darkToggle = document.getElementById('darkModeToggle');
        if (darkToggle) {
            darkToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('darkMode', isDark ? 'enabled' : 'disabled');
                darkToggle.textContent = isDark ? '☀️ 明亮' : '🌙 暗黑';
                draw();
            });
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
                darkToggle.textContent = '☀️ 明亮';
            } else {
                document.body.classList.remove('dark-mode');
                darkToggle.textContent = '🌙 暗黑';
            }
        }

        refreshUI();
        draw();
    })();
</script>
</body>
